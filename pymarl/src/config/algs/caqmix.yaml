# --- CA-QMIX ---
# Original PyMARL training setup: RMSprop, 32-episode batches, 5000-episode buffer,
# hard target update every 200 episodes. 8 parallel environments.
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

runner: "parallel"
batch_size_run: 8
train_steps_per_cycle: 8  # one update per collected episode
buffer_size: 5000
batch_size: 32
buffer_cpu_only: True

optimizer: "rmsprop"
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
gamma: 0.99
grad_norm_clip: 10
double_q: True
target_update_interval: 200

agent: "caqmix"
mac: "caq_mac"
learner: "caqmix_learner"
agent_output_type: "q"
rnn_hidden_dim: 64
obs_agent_id: True
obs_last_action: True     # own last action in the agent input

mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# CA-QMIX
attention_size: 32
lambda_delta_q: 1.0       # weight of the Delta-Q regulariser (0 disables it)
use_alpha: True           # False: Q = Q_base + Q_coop without the gate
gate_variant: "full"      # full | binary | no_hard_mask | no_vis_input | shuffled_vis
center_coop: False        # subtract the action mean from Q_coop
ablation: null            # alpha_none | binary_gate | delta_q_none | no_hard_mask | no_vis_input | shuffled_vis

t_max: 2050000
test_interval: 10000
test_nepisode: 32
test_greedy: True
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
save_model: False
use_tensorboard: False

env_args:
  obs_last_action: True   # allies' last actions in the observation

name: "caqmix"
